<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AOC 泰國行前會｜時間已確定</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#ffffff; --fg:#242424; --ink:#191919; --muted:#6b6b6b; --faint:#9b9b9b;
  --rule:#f2f2f2; --rule-strong:#e6e6e6; --fill:#e8e3e5; --accent:#32200b; --bad:#b3261e;
  --on-accent:#ffffff;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --fg:#e6e6e6; --ink:#f0f0f0; --muted:#a0a0a0; --faint:#777777;
    --rule:#262626; --rule-strong:#333333; --fill:#2a2522; --accent:#d9b78f; --bad:#e57368;
    --on-accent:#121212; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --fg:#e6e6e6; --ink:#f0f0f0; --muted:#a0a0a0; --faint:#777777;
  --rule:#262626; --rule-strong:#333333; --fill:#2a2522; --accent:#d9b78f; --bad:#e57368;
  --on-accent:#121212; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:64px}
.col{max-width:680px;margin:0 auto}
h1{font-size:clamp(1.75rem,7vw,2.4rem);font-weight:900;color:var(--ink);line-height:1.25;margin:28px 0 0;letter-spacing:-.01em}
h1 span{display:block}
.when{background:var(--fill);border-radius:8px;padding:22px 18px;margin:24px 0 0;text-align:center;color:var(--ink)}
.when .d{font-size:clamp(2rem,9vw,2.6rem);font-weight:900;line-height:1.2;white-space:nowrap}
.when .t{font-size:clamp(1.6rem,7.5vw,2.1rem);font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{color:var(--muted);font-size:1.05rem;margin:20px 0 0}
</style>
</head>
<body>
<div class="col">
  <h1><span>AOC 泰國行前會</span><span>時間已確定</span></h1>
  <div class="when"><div class="d">11/23（一）</div><div class="t">12:00–13:00</div></div>
  <p class="note">填寫已關閉。詳細請看 LINE 群組公告。</p>
</div>
</body>
</html>
